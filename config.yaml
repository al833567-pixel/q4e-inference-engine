# 推理工具 — 設定（A 定簽章，B 用）
# 對應 interfaces.py 的 ServerConfig / EngineConfig / CacheConfig。

server:
  host: 127.0.0.1
  port: 8080
  model_name: qwen3.8-flash-next
  # API key：留空 = 讀環境變數 DSH_API_KEY（可多 key，以空白分隔）
  api_keys: []            # 例：["sk-abc123", "sk-def456"]
  stream_default: false
  engine: llama           # "stub"（A，不載模型）| "llama"（B 改：lazy load GGUF）；env DSH_ENGINE 可覆蓋

engine:                   # Track B（有 GPU）用
  gguf_dir: D:\AI_Model\Qwen3.8-Flash-Next
  ngl: 10                 # VRAM 層（B 設定）：10 層 × ~1.69 GB ≈ 17 GB + KV/緩衝 < 24 GB；其餘 38 層 mmap 在 CPU（RAM/SSD 分頁）
  max_ctx: 2048
  n_batch: 512
  n_threads: 0            # 0 = 自動
  lib_path: D:\llama      # B：fork llama.dll（wheel 自帶版載不了 qwen4exp）；fork_compat 72B→80B

cache:                    # 兩層快取（A 寫邏輯，B 接 placement）
  n_layers: 48
  n_experts_per_layer: 512
  active_routed: 10
  has_shared: true
  vram_capacity_per_layer: 20    # L1：2×激活（20 routed + shared 常駐）
  ram_capacity_per_layer: 142    # L2：≈18 GB 預算
  ram_mult: 1                  # N：RAM = N × 一輪未命中
  ssd_path: D:\
  ng_on_ssd: true
  prefetch_into: ram       # 快取過濾：只預取進 RAM，不污染 VRAM

ngram:
  # N-gram 表（per_layer_token_embd，51.2B，4.5 bit/value，28.8 GB）
  on_ssd: true             # B-7：離到 host/SSD + 非同步預取
  bench_reads: 1000        # A-3：隨機讀次數
