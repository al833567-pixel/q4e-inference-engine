# 推理工具 — 設定（v4：C++ 唯一實現）
# 合約＝C++ 實作：cache＝engine/common/q4e-expert-cache.{h,cpp}；ngram＝engine/common/q4e-ngram.{h,cpp}；/v1＝上游 q4e-server
# 本檔為 human-readable SPEC（ngl=10、cache 容量、gguf_dir），非執行設定
# engine 段＝參考參數（生產引擎 q4e-server 會有自己的 config）

server:
  host: 127.0.0.1
  port: 8080
  model_name: qwen3.8-flash-next
  # API key：留空 = 讀環境變數 DSH_API_KEY（可多 key，以空白分隔）
  api_keys: []            # 例：["sk-abc123", "sk-def456"]
  stream_default: false
  engine: stub            # 合約參考（確定性、不載模型）；生產引擎＝q4e-server

engine:                   # 參考參數（ngl 紅線：固定 10）
  gguf_dir: D:\AI_Model\Qwen3.8-Flash-Next
  ngl: 10                 # 10 層 × ~1.69 GB ≈ 17 GB + KV/緩衝 < 24 GB；其餘 38 層 mmap 在 CPU（RAM/SSD 分頁）
  max_ctx: 2048
  n_batch: 512
  n_threads: 0            # 0 = 自動

cache:                    # q4e 動態快取核心 spec（語義＝cache.py，14 測試向量）
  n_layers: 48
  n_experts_per_layer: 512
  active_routed: 10
  has_shared: true
  vram_capacity_per_layer: 20    # L1：2×激活（20 routed + shared 常駐）
  ram_capacity_per_layer: 142    # L2：≈18 GB 預算
  ram_mult: 1                  # N：RAM = N × 一輪未命中
  ssd_path: D:\
  ng_on_ssd: true
  prefetch_into: ram       # 快取過濾：只預取進 RAM，不污染 VRAM

ngram:
  # N-gram 表（per_layer_token_embd，51.2B，4.5 bit/value，28.8 GB）
  on_ssd: true             # PLE 離載（SSD）+ 非同步預取
  bench_reads: 1000        # bench_ngram.py 隨機讀次數
